[package]
name = "relay-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
relay-protocol = { path = "../relay-protocol" }
relay-runtime = { path = "../relay-runtime" }
relay-store = { path = "../relay-store" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt", "sync", "time"] }
toml = "0.8.19"
uuid = { version = "1.12.1", features = ["serde", "v4"] }

[dev-dependencies]
relay-runtime-fake = { path = "../../runtimes/relay-runtime-fake" }
tokio = { version = "1.43.0", features = ["macros", "rt", "rt-multi-thread", "time"] }
