[package]
name = "relay-tui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28.1", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29.0"
relay-core = { path = "../../crates/relay-core" }
relay-runtime = { path = "../../crates/relay-runtime" }
relay-runtime-antigravity = { path = "../../runtimes/relay-runtime-antigravity" }
relay-runtime-codex = { path = "../../runtimes/relay-runtime-codex" }
relay-runtime-fake = { path = "../../runtimes/relay-runtime-fake" }
tokio = { version = "1.43.0", features = ["macros", "process", "rt", "sync", "time"] }
