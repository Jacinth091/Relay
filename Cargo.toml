[workspace]
members = [
    "apps/relay-tui",
    "crates/relay-core",
    "crates/relay-protocol",
    "crates/relay-runtime",
    "crates/relay-store",
    "runtimes/relay-runtime-fake",
    "runtimes/relay-runtime-codex",
    "runtimes/relay-runtime-antigravity",
    "runtimes/relay-decision-jev",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Jacinth091/Relay"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
