[package]
name = "relay-runtime-codex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
relay-runtime = { path = "../../crates/relay-runtime" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
uuid = { version = "1.12.1", features = ["v4"] }

[dev-dependencies]
relay-protocol = { path = "../../crates/relay-protocol" }
